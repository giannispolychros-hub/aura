name: AURA stress test (real model)

# Το στρες τεστ του Σταδίου Α (ADR «10 Οκτωβρίου (β)»). ΜΟΝΟ χειροκίνητα, από το κουμπί «Run workflow» — ποτέ αυτόματα.
# Το GitHub δείχνει και επιτρέπει το «Run workflow» μόνο σε όσους έχουν δικαίωμα γραφής στο repo.
#   dry    = μόνο σχέδιο και εκτίμηση κόστους (καμία κλήση, κόστος 0)
#   μικρό  = οι συνεδρίες 14, 15, 16 και 1 (μία φορά), όριο $3
#   πλήρες = όλες οι 24 συνεδρίες, όριο $25
#   επιλογή = μόνο οι συνεδρίες του πεδίου «sessions» (π.χ. 15,1.1,4.2), με το όριο του πεδίου «budget» (το πολύ $25)
# Το κλειδί έρχεται ΜΟΝΟ από το secret ANTHROPIC_API_KEY, μόνο ως μεταβλητή περιβάλλοντος του βήματος που το χρειάζεται.
# Δεν τυπώνεται, δεν γράφεται σε αρχείο ή artifact (το script ελέγχει κάθε έξοδο, και το GitHub το κρύβει στα logs).
# Η αναφορά ανεβαίνει και στο branch «stress-reports» (φάκελος runs/<αριθμός εκτέλεσης>), για να διαβάζεται και έξω από τη σελίδα
# της εκτέλεσης. Αυτό το κάνει ΧΩΡΙΣΤΗ δουλειά (publish), που δεν έχει το κλειδί· μόνο αυτή έχει δικαίωμα εγγραφής.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry = σχέδιο και κόστος · μικρό = 14, 15, 16, 1 με όριο $3 · πλήρες = όλες με όριο $25 · επιλογή = τα πεδία από κάτω'
        type: choice
        options:
          - dry
          - μικρό
          - πλήρες
          - επιλογή
        default: dry
      sessions:
        description: 'Μόνο για «επιλογή»: οι συνεδρίες, π.χ. 15,1.1,4.2'
        type: string
        default: ''
      budget:
        description: 'Μόνο για «επιλογή»: όριο σε δολάρια (το πολύ 25)'
        type: string
        default: '5'

permissions:
  contents: read

concurrency:
  group: aura-stress
  cancel-in-progress: false

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Υπάρχει το κλειδί; (ελέγχεται χωρίς να διαβαστεί)
        if: inputs.mode != 'dry'
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error title=Λείπει το κλειδί::Δεν υπάρχει το secret ANTHROPIC_API_KEY. Settings → Secrets and variables → Actions → New repository secret."
            {
              echo "## ✗ Δεν έτρεξε"
              echo ""
              echo "Λείπει το secret **ANTHROPIC_API_KEY**. Πρόσθεσέ το στο Settings → Secrets and variables → Actions και ξανάτρεξε."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Εργαλεία της δοκιμής (δεν αλλάζουν κανένα αρχείο του έργου)
        run: |
          npm ci
          npm install --no-save playwright@1.56.1 @anthropic-ai/sdk@0.133.0

      - name: Browser (μόνο για μικρό / πλήρες)
        if: inputs.mode != 'dry'
        run: npx playwright install --with-deps chromium

      - name: Στρες τεστ
        timeout-minutes: 85
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODE: ${{ inputs.mode }}
          SESSIONS: ${{ inputs.sessions }}
          BUDGET: ${{ inputs.budget }}
        run: |
          OUT="$(node -p "require('os').tmpdir()")/aura_stress"
          echo "AURA_STRESS_OUT=$OUT" >> "$GITHUB_ENV"
          case "$MODE" in
            dry)    node scripts/e2e_stage_a.cjs --stress --real --dry --out "$OUT" ;;
            μικρό)  node scripts/e2e_stage_a.cjs --stress --real --yes --sessions 14,15,16,1.1 --budget 3 --minutes 75 --out "$OUT" ;;
            πλήρες) node scripts/e2e_stage_a.cjs --stress --real --yes --budget 25 --minutes 75 --out "$OUT" ;;
            επιλογή)
              # only digits, dots and commas; a number for the budget (the script refuses anything above $25)
              if ! [[ "$SESSIONS" =~ ^[0-9][0-9.,]*$ ]] || ! [[ "$BUDGET" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
                echo "::error::Για «επιλογή» χρειάζονται συνεδρίες (π.χ. 15,1.1) και όριο σε δολάρια."; exit 2
              fi
              node scripts/e2e_stage_a.cjs --stress --real --yes --sessions "$SESSIONS" --budget "$BUDGET" --minutes 75 --out "$OUT" ;;
            *)      echo "::error::Άγνωστη επιλογή"; exit 2 ;;
          esac

      - name: Η αναφορά ως artifact
        if: always() && inputs.mode != 'dry' && env.AURA_STRESS_OUT != ''
        uses: actions/upload-artifact@v4
        with:
          name: aura-stress-report-${{ github.run_number }}
          path: ${{ env.AURA_STRESS_OUT }}
          if-no-files-found: warn
          retention-days: 30

  # Η αναφορά στο branch «stress-reports». Χωριστή δουλειά: ΔΕΝ έχει το κλειδί (κανένα secret), έχει μόνο δικαίωμα εγγραφής, και
  # παίρνει μόνο το artifact που ανέβασε η πρώτη (ήδη ελεγμένο από το script ότι δεν περιέχει το κλειδί).
  publish:
    needs: stress
    if: always() && inputs.mode != 'dry' && needs.stress.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: aura-stress-report-${{ github.run_number }}
          path: report

      - uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1

      - name: Στο branch stress-reports
        env:
          RUN: ${{ github.run_number }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ ! -d report ] || [ -z "$(ls -A report)" ]; then echo "Καμία αναφορά για ανέβασμα."; exit 0; fi
          cd repo
          git config user.name "aura-stress-report"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q --depth 1 origin stress-reports; then
            git checkout -q -B stress-reports FETCH_HEAD
          else
            git checkout -q --orphan stress-reports
            git rm -rqf .
          fi
          mkdir -p "runs/$RUN"
          cp -r ../report/. "runs/$RUN/"
          git add "runs/$RUN"
          git commit -q -m "Stress report, run $RUN ($MODE)"
          git push -q origin stress-reports
          echo "Η αναφορά: branch stress-reports, φάκελος runs/$RUN" >> "$GITHUB_STEP_SUMMARY"
