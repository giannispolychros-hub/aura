<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#080808" />
    <meta name="description" content="AURA — Clarity over advice. Thinking over answers." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Mono:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <title>AURA</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { height: 100%; background: #080808; color: #c4c0b8; }
    </style>
    <script>
      window.__auraLogError = function(source, message) {
        try { console.error('[AURA:' + source + ']', String(message).slice(0, 200)); } catch(e) {}
      };
      window.addEventListener('error', function(e) {
        window.__auraLogError('window', e?.message || 'unknown error');
      });
      window.addEventListener('unhandledrejection', function(e) {
        window.__auraLogError('promise', e?.reason?.message || String(e?.reason || 'unknown rejection'));
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
